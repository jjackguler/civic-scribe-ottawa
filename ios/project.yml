name: TheBrief
options:
  bundleIdPrefix: com.aibroadsheet
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TheBrief:
    type: application
    platform: iOS
    sources: [TheBrief]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aibroadsheet.brief
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Brief
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSSupportsLiveActivities: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  TheBriefTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TheBriefTests]
    dependencies:
      - target: TheBrief
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TheBriefUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TheBriefUITests]
    dependencies:
      - target: TheBrief
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TheBrief:
    build:
      targets:
        TheBrief: all
    test:
      targets: [TheBriefTests, TheBriefUITests]
