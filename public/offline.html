<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B2A2F"><meta name="robots" content="noindex"><title>Offline — AI Broadsheet</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#10191b;font:16px/1.6 system-ui,sans-serif}header{background:#0b2a2f;color:#fff;padding:24px max(20px,env(safe-area-inset-left));border-bottom:4px solid #f5c400;font:700 24px Georgia,serif}main{max-width:760px;margin:auto;padding:40px 20px}h1{font:36px/1.12 Georgia,serif}h2{font:600 23px/1.2 Georgia,serif}p{color:#56635f}button,a{min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;background:#0b2a2f;color:#fff;border:0;border-radius:4px;text-decoration:none;font-size:15px;cursor:pointer}article{padding:22px 0;border-top:1px solid #d6ddda}small{display:block;color:#56635f}.tag{font-size:11px;font-weight:700;color:#0e6a70;letter-spacing:.1em}.notice{background:#e5ebe9;padding:12px 16px}.date{font-size:12px}footer{padding:24px 0;font-size:13px}#language{float:right;font-size:13px;border:1px solid #c9a24d;padding:6px 12px}button:focus-visible,a:focus-visible{outline:3px solid #0e6a70;outline-offset:4px}</style></head><body><header>AI Broadsheet<button id="language">Français</button></header><main><span class="tag" id="tag"></span><h1 id="heading"></h1><p id="intro"></p><button id="retry"></button><p id="connection" role="status"></p><h2 id="saved-heading"></h2><div id="stories"></div><footer id="footer"></footer></main><script>
let french=location.pathname==='/fr'||location.pathname.startsWith('/fr/');
const copy={en:{tag:'YOUR PAPER, EVEN OFFLINE',heading:'The connection can wait.',intro:'Your saved headlines and summaries are here. Live news and full articles need an internet connection.',retry:'Try again',saved:'Your saved summaries',empty:'No stories saved yet. When you’re online, open an article and tap Save story.',footer:'Stored on this device only. These are saved summaries, not current reporting or full publisher articles.',back:'Your device reports a connection. Tap Try again to check the live page.',savedAt:'Saved ',older:'This summary is more than 3 days old. Check the live article for updates.',open:'Open story online',source:'Source: '},fr:{tag:'VOTRE JOURNAL, MÊME HORS CONNEXION',heading:'La connexion peut attendre.',intro:'Vos titres et résumés enregistrés restent ici. Les nouvelles en direct et les articles complets nécessitent une connexion.',retry:'Réessayer',saved:'Vos résumés enregistrés',empty:'Aucun article enregistré. Une fois en ligne, ouvrez un article et touchez Enregistrer.',footer:'Sur cet appareil seulement. Il s’agit de résumés enregistrés, pas de nouvelles à jour ni d’articles complets.',back:'Votre appareil indique une connexion. Touchez Réessayer pour vérifier la page.',savedAt:'Enregistré le ',older:'Ce résumé date de plus de 3 jours. Consultez l’article à jour.',open:'Ouvrir l’article en ligne',source:'Source : '}};
const el=id=>document.getElementById(id);const add=(tag,text,at,cls)=>{const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;at.appendChild(n);return n;};
function render(){const t=copy[french?'fr':'en'];document.documentElement.lang=french?'fr':'en';el('language').textContent=french?'English':'Français';for(const [id,key] of [['tag','tag'],['heading','heading'],['intro','intro'],['retry','retry'],['saved-heading','saved'],['footer','footer']])el(id).textContent=t[key];el('stories').replaceChildren();let items=[];try{const a=JSON.parse(localStorage.getItem('ab-saved-v1')||'[]');if(Array.isArray(a))items=a.slice(0,100);}catch{}items=items.filter(s=>s&&typeof s.title==='string'&&typeof s.path==='string'&&/^\/(?:fr\/)?(?:story|article)\/[a-zA-Z0-9_%.-]+$/.test(s.path)&&!/%(?:2f|5c|00)/i.test(s.path));if(!items.length)add('p',t.empty,el('stories'));items.forEach(s=>{const a=add('article','',el('stories'));add('small',t.source+String(s.source||'AI Broadsheet').slice(0,120),a);add('h2',s.title.slice(0,300),a);add('p',String(s.summary||'').slice(0,1400),a);const date=new Date(s.savedAt);add('small',t.savedAt+(Number.isNaN(+date)?'—':date.toLocaleDateString(french?'fr-CA':'en-CA')),a,'date');if(Number.isNaN(+date)||Date.now()-date>3*86400000)add('p',t.older,a,'notice');const link=add('a',t.open,a);link.href=s.path;});el('connection').textContent=navigator.onLine?t.back:'';}
el('language').onclick=()=>{french=!french;render();};el('retry').onclick=()=>{if(['/offline','/offline.html'].includes(location.pathname))location.assign(french?'/fr':'/');else location.reload();};window.addEventListener('online',render);window.addEventListener('offline',render);render();
</script></body></html>
