<!doctype html><html><head><meta charset="utf-8">
<!--
  AI Broadsheet "Zine" reels, 1080x1920: paper-collage explainers in three looks
  (ink cats in a hand-drawn frame, Dada newsprint, riso grid with hypnotic eyes).
  Archive photos are public domain (assets branch, credited on the end card) and
  go through a xerox / halftone treatment; everything else is drawn here.
  Narration comes from boards/<slug>.json: with voice/<slug>/timing.json the
  picture follows the voice word by word, without it the timing is estimated.
  render.mjs calls setup(slug) once and frame(t) per video frame.
-->

<script>
const W = 1080, H = 1920, FPS = 30, BOIL = 12;

const loadImg = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error("missing " + src)); i.src = src; });

// ── stop-motion "boil": every cut-out jitters a little, 12 times a second ──
let T = 0;

// newspaper columns of pseudo-text, the way the Dada poster uses them
const WORDS = "the of and to in a is that for on it with as was by at from this be are or an have not which but they his were all one their there been has more when will would who can if about what so said no out up into than other time some could them only these two may then first any new like our over such man also most made after many did well years before must through back where much your way down should because each just those people how too little state good very make world still own see men work long here between both life being under never day same another know while last might us great old year off come since against go came right used take three states himself few house use during without again place around however home small found mrs thought went say part once general high upon school every don does got united left number course war until always away something fact though water less public put think almost hand enough far took head yet government system better set told nothing night end why called didn eyes find going look asked later knew point next program city business give group toward young days let room president side social given present several order national possible rather second face per among form important often things looked early white case john become large big need four within felt along children saw best church ever least power development light thing seemed family interest want members mind country area others done turned although open god service certain kind problem began different door thus help sense means whole matter perhaps itself york times law human line above name example action company hands local show whether five history gave today either act feet across taken past quite anything seen having death week experience body word half really field am car words already themselves information tell together college shall money period held keep sure probably free seems political real behind cannot miss question air office making brou const newsTex = (w, h, base = "#e9e0cc") => mk(w, h, (g) => {
  g.drawImage(paperTex(w, h, base, { gr: 14 }), 0, 0);
  const cols = Math.max(2, Math.round(w / 230)), cw = (w - 30) / cols; let hdY = 20;
  g.fillStyle = "rgba(25,20,15,.85)"; g.font = "700 46px Osw"; g.fillText(pseudo(3).toUpperCase(), 18, hdY + 44); hdY += 70;
  g.font = "15px serif"; g.fillStyle = "rgba(30,25,20,.78)";

    while (y < h - 10) { if (rnd() < .06) { g.font = "700 22px serif"; g.fillText(pseudo(2), x, y + 18); y += 30; g.font = "15px serif"; continue; }
      let line = ""; while (g.measureText(line).width < cw - 40) line += WORDS[Math.floor(rnd() * WORDS.length)] + " "; g.fillText(line, x, y + 14); y += 18; } }

// ── torn cut-outs ───────────────────────────────────────────────────────────
function tornPath(g, w, h, rough = 7, step = 9) {

/** Puts `src` on a torn scrap of paper with a white rim and a soft shadow. */
function scrap(src, { pad = 14, rim = PAPER, rough = 9, shadow = true, bg = null } = {}) {

  return mk(w + m * 2, h + m * 2, (g) => {
    g.translate(m, m);
    if (shadow) { g.save(); g.translate(8, 10); tornPath(g, w, h, rough); g.fillStyle = "rgba(0,0,0,.28)"; g.filter = "blur(6px)"; g.fill(); g.restore(); }
    g.save(); tornPath(g, w, h, rough); g.fillStyle = rim; g.fill(); g.clip();
    if (bg) { g.drawImage(bg, 0, 0, w, h); }
    g.drawImage(src, pad, pad); g.restore();
    g.save(); tornPath(g, w, h, rough); g.strokeStyle = "rgba(0,0,0,.18)"; g.lineWidth = 1.5; g.stroke(); g.restore();
  });

// ── photo treatments: xerox (stipple) and halftone ──────────────────────────
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + .5) / 16);

}

// ── type ────────────────────────────────────────────────────────────────────

/** Rubber stamp: double border, worn ink. */

    g.globalCompositeOperation = "destination-out"; for (let i = 0; i < g.canvas.width * g.canvas.height * .0035; i++) { g.fillStyle = `rgba(0,0,0,${R(.2, .9)})`; g.beginPath(); g.arc(R(0, g.canvas.width), R(0, g.canvas.height), R(.6, 3.2), 0, 7); g.fill(); }
  });

/** A stamp slammed onto the page at time `at`. */

      g.fillStyle = INK; g.beginPath(); g.ellipse(peek ? -3 : 0, 0, 2.4, 7, 0, 0, 7); g.fill(); g.restore(); }

function estimate(board) {

    g.globalCompositeOperation = "destination-out"; for (let x = 0; x < 560; x += 28) { g.beginPath(); g.moveTo(x, 760); g.lineTo(x + 14, 744); g.lineTo(x + 28, 760); g.fill(); } });

  const h = cue(i, "half"); if (lt > h - .1) { const f = clamp(1 - (lt - h + .1) / .35); g.fillStyle = `rgba(255,253,240,${f * .9})`; g.fillRect(0, 0, W, H); }
  place(g, TEX.half, 300, 1080, { id: 3, s: back((lt - h) / .3), rot: -.08 }); place(g, TEX.halfP, 330, 1290, { id: 4, s: back((lt - h - .15) / .3), rot: -.08 });

const _ic = new Map(); function inkedCache(text, font, size, col = INK) { const k = text + font + size + col; if (!_ic.has(k)) _ic.set(k, inked("", font, size, col, { lines: text.split("\n"), wear: .5 })); return _ic.get(k); }
const _sc = new Map(); function stampCache(text, col, size) { const k = text + col + size; if (!_sc.has(k)) _sc.set(k, stampC(text.split("\n"), col, size)); return _sc.get(k); }

// ── setup and frames ───────────────────────────────────────────────────────
const g = document.getElementById("c").getContext("2d");
window.setup = async (slug, timing, musicCredit) => {
  BOARD = await (await fetch(`boards/${slug}.json`)).json(); TIMING = timing ?? estimate(BOARD); music = musicCredit || "CC0, via Freesound";
  await Promise.all(["40px Anton", "700 40px Osw", "500 40px Osw", "40px Type", "700 40px Bod"].map((f) => document.fonts.load(f)));
  ART = await Promise.all(BOARD.art.map((a) => loadImg(".assets/" + a)));
  TEX.mark = await loadImg("../nightcity/mark.svg");
  seed = [...slug].reduce((a, c) => a * 31 + c.charCodeAt(0), 7);
  await LOOKS[BOARD.style].build();
  TEX.outroMark = mk(420, 420, (h) => h.drawImage(TEX.mark, 10, 10, 400, 400)); TEX.outroName = inked("AI BROADSHEET", "Bod", 92, INK, { wear: .2, track: 6 });
  // a scene holds its picture until just before the next one is spoken, so late cues get seen
  SC = TIMING.scenes.map((s, i) => ({ t0: i ? Math.max(TIMING.scenes[i - 1].end + .1, s.start - .25) : 0 }));
  DUR = TIMING.duration + OUTRO;
  return { duration: DUR, fps: FPS, sfx: sfxPlan() };
};
/** Where the sound effects go: a tear at each scene change, a stamp at each cue. */
function sfxPlan() {
  const ev = []; TIMING.scenes.forEach((s, i) => { if (i) ev.push({ t: SC[i].t0, f: "fs-paper-tear--759323.mp3", v: .35, d: .7 }); const c = BOARD.scenes[i].cue; if (c) ev.push({ t: SC[i].t0 + cue(i, c), f: "fs-rubber-stamp--448474.mp3", v: .55, d: .5 }); });
  ev.push({ t: TIMING.duration, f: "fs-whoosh--486234.mp3", v: .4, d: 1.2 }); return ev;
}
window.frame = (t) => {
  T = t; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = "none";
  if (t >= TIMING.duration) { outro(g, t - TIMING.duration); return; }
  let i = 0; while (i < SC.length - 1 && t >= SC[i + 1].t0) i++;
  const t0 = SC[i].t0, t1 = i < SC.length - 1 ? SC[i + 1].t0 : TIMING.duration, lt = t - t0;
  LOOKS[BOARD.style][BOARD.scenes[i].type](g, lt, t1 - t0, i);
  if (i > 0 && lt < .18) { g.save(); g.fillStyle = KRAFT; g.beginPath(); const k = 1 - lt / .18; tornLike(g, -20, H * (1 - k), W + 40, H * k + 40); g.fill(); g.restore(); } // paper wipe
  ticker(g, t); mast(g); captions(g, t, i);
};
