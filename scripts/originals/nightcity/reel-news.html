<!doctype html><html><head><meta charset="utf-8">
<!--
  AI Broadsheet news reels, 1080x1920, night-city painterly language (indigo
  starry skies, warm windows with silhouettes, a teal fire-escape alley, a blue
  foggy tenement with one red window, a moonlit rooftop). One page, several
  stories: reel-news.html?story=<id>. Captions carry only facts from the cited
  sources; the art is an illustration and says so on screen.
  render-reel.mjs calls window.setup() once, then window.frame(t) per video frame.
-->
<style>
@font-face{font-family:Bod;src:url("node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-700-normal.woff2");font-weight:700}
@font-face{font-family:Bod;src:url("node_modules/@fontsource/bodoni-moda/files/bodoni-moda-latin-800-italic.woff2");font-weight:800;font-style:italic}
@font-face{font-family:Grot;src:url("node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2");font-weight:400 900}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#121212;--ivory:#EFE8DA;--red:#D9412B;--y:#F5C400}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1a24;color:var(--ivory)}
canvas{position:absolute;inset:0}
#mast{position:absolute;left:56px;top:96px;display:flex;align-items:center;gap:16px;z-index:5}
#mast img{width:50px;height:50px}
#mast b{font-family:Bod;font-weight:700;font-size:28px;letter-spacing:5px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#ill{position:absolute;right:56px;top:108px;z-index:5;font-family:Grot;font-weight:700;font-size:17px;letter-spacing:2.5px;background:rgba(18,18,18,.82);padding:8px 13px;border-left:3px solid var(--y)}
#panel{position:absolute;left:56px;right:56px;bottom:360px;z-index:5;background:rgba(18,18,18,.88);padding:34px 42px 38px;border-top:5px solid var(--red)}
#kick{display:flex;align-items:center;gap:16px;font-family:Grot;font-weight:800;font-size:24px;letter-spacing:4px;color:var(--red);margin-bottom:14px}
#kick i{display:block;width:48px;height:5px;background:var(--red)}
.line{font-family:Grot;font-weight:800;font-size:56px;line-height:1.12;letter-spacing:-.5px}
.line em,.title em{font-style:normal;color:var(--y)}
.title{font-family:Bod;font-weight:700;font-size:118px;line-height:1.0;letter-spacing:-1px;margin:4px 0 10px;padding-left:10px}
.title em{font-style:italic;font-weight:800}
.big{font-family:Bod;font-weight:800;font-style:italic;font-size:250px;line-height:.95;color:var(--y);margin:2px 0 6px;letter-spacing:-4px}
.big small{font-size:110px;letter-spacing:0;margin-left:10px}
.w{display:inline-block;will-change:transform}
.bars{margin-top:22px;display:grid;gap:16px}
.bar{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:18px;font-family:Grot;font-weight:800;font-size:30px}
.bar span{display:block;height:58px;background:var(--y);color:var(--ink);font-size:30px;line-height:58px;padding-left:16px;white-space:nowrap;overflow:hidden}
.bar.h span{background:var(--ivory)}
.src{margin-top:20px;font-family:Grot;font-weight:600;font-size:21px;letter-spacing:2px;opacity:.75}
#pin{position:absolute;z-index:4;display:none;font-family:Grot;font-weight:800;font-size:28px;background:var(--y);color:var(--ink);padding:10px 14px;white-space:nowrap}
#pinline{position:absolute;inset:0;z-index:4;pointer-events:none}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="mast"><img src="mark.svg" alt=""><b>AI BROADSHEET</b></div>
<div id="ill">ILLUSTRATION</div>
<div id="panel"></div>
<script>
const W = 1080, H = 1920, FPS = 30;
let seed = 74;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const R = (a, b) => a + rnd() * (b - a);
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
// a cheap deterministic hash for per-frame flicker
const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

function layer(w, h, fn) { const c = document.createElement("canvas"); c.width = w; c.height = h; fn(c.getContext("2d"), w, h); return c; }

// ── the painter: a base fill, then many short translucent strokes and drips ──
function paint(g, x, y, w, h, [hh, s, l], o = {}) {
  const { n = Math.round(w * h / 380), ang = Math.PI / 2, aj = .3, len = [18, 80], wid = [3, 11], dl = 8, dh = 6, a = [.07, .22], drips = 0, base = true, clip } = o;
  g.save(); g.beginPath(); clip ? clip(g) : g.rect(x, y, w, h); g.clip();
  if (base) { g.fillStyle = hsl(hh, s, l); g.fillRect(x, y, w, h); }
  g.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const cx = x + rnd() * w, cy = y + rnd() * h, an = ang + (rnd() * 2 - 1) * aj, L = R(...len);
    g.strokeStyle = hsl(hh + (rnd() * 2 - 1) * dh, clamp(s + (rnd() * 2 - 1) * 6, 0, 100), clamp(l + (rnd() * 2 - 1) * dl, 0, 100), R(...a));
    g.lineWidth = R(...wid); g.beginPath();
    g.moveTo(cx - Math.cos(an) * L / 2, cy - Math.sin(an) * L / 2);
    g.quadraticCurveTo(cx + R(-6, 6), cy + R(-6, 6), cx + Math.cos(an) * L / 2, cy + Math.sin(an) * L / 2); g.stroke();
  }
  for (let i = 0; i < drips; i++) {
    const dx = x + rnd() * w, dy = y + rnd() * h * .7, L = R(40, 280), gr = g.createLinearGradient(0, dy, 0, dy + L);
    gr.addColorStop(0, hsl(hh, s, l - 12, .4)); gr.addColorStop(1, hsl(hh, s, l - 12, 0));
    g.strokeStyle = gr; g.lineWidth = R(2, 7); g.beginPath(); g.moveTo(dx, dy); g.lineTo(dx + R(-3, 3), dy + L); g.stroke();
  }
  g.restore();
}
function glow(g, x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, "rgba(0,0,0,0)");
  g.save(); g.globalCompositeOperation = "lighter"; g.globalAlpha = a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function vgrad(g, x, y, w, h, stops) { const gr = g.createLinearGradient(0, y, 0, y + h); stops.forEach(([p, c]) => gr.addColorStop(p, c)); g.fillStyle = gr; g.fillRect(x, y, w, h); }
function person(g, x, y, s, col, pose = "stand") { // a small silhouette, feet at (x, y), height s
  g.save(); g.fillStyle = col; g.strokeStyle = col; g.lineCap = "round";
  if (pose === "crouch") {
    g.beginPath(); g.arc(x, y - s * .55, s * .09, 0, 7); g.fill();
    g.beginPath(); g.moveTo(x - s * .16, y - s * .44); g.quadraticCurveTo(x + s * .02, y - s * .52, x + s * .14, y - s * .40); g.lineTo(x + s * .18, y - s * .06); g.lineTo(x - s * .22, y); g.closePath(); g.fill();
    g.lineWidth = s * .05; g.beginPath(); g.moveTo(x - s * .1, y - s * .38); g.lineTo(x - s * .32, y - s * .26); g.stroke();
  } else if (pose === "sit") {
    g.beginPath(); g.arc(x, y - s * .62, s * .1, 0, 7); g.fill();
    g.fillRect(x - s * .12, y - s * .52, s * .24, s * .3); g.fillRect(x - s * .12, y - s * .24, s * .38, s * .08); g.fillRect(x + s * .2, y - s * .24, s * .07, s * .24);
  } else {
    g.beginPath(); g.arc(x, y - s * .9, s * .085, 0, 7); g.fill();
    g.beginPath(); g.moveTo(x - s * .15, y - s * .78); g.lineTo(x + s * .15, y - s * .78); g.lineTo(x + s * .11, y - s * .42); g.lineTo(x + s * .09, y); g.lineTo(x + s * .02, y); g.lineTo(x, y - s * .36);
    g.lineTo(x - s * .02, y); g.lineTo(x - s * .09, y); g.lineTo(x - s * .11, y - s * .42); g.closePath(); g.fill();
    if (pose === "phone") { g.lineWidth = s * .055; g.beginPath(); g.moveTo(x + s * .12, y - s * .74); g.quadraticCurveTo(x + s * .24, y - s * .64, x + s * .12, y - s * .58); g.stroke(); }
    if (pose === "walk") { g.lineWidth = s * .06; g.beginPath(); g.moveTo(x, y - s * .38); g.lineTo(x + s * .14, y); g.stroke(); g.fillRect(x + s * .12, y - s * .5, s * .16, s * .12); }
  }
  g.restore();
}
function railing(g, x1, x2, y, h, col, step = 14) {
  g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.moveTo(x1, y - h); g.lineTo(x2, y - h); g.moveTo(x1, y - h * .5); g.lineTo(x2, y - h * .5); g.stroke();
  g.lineWidth = 2; g.beginPath(); for (let x = x1; x <= x2; x += step) { g.moveTo(x, y - h); g.lineTo(x, y); } g.stroke();
}
function stairs(g, x1, y1, x2, y2, col) {
  g.strokeStyle = col; g.lineWidth = 4; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.moveTo(x1, y1 - 70); g.lineTo(x2, y2 - 70); g.stroke();
  g.lineWidth = 3; const n = 12; g.beginPath(); for (let i = 1; i < n; i++) { const t = i / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; g.moveTo(x - 14, y); g.lineTo(x + 14, y); } g.stroke();
}

// ── scenes ──────────────────────────────────────────────────────────────────
// Each scene: prerendered painted layers in build(), animated parts in draw(g, t).
const S = {};
const WARM = ["#ffb45a", "#ff9c3d", "#ffcf86", "#ffa64c", "#ffe0a6"];
const GROUPS = [["Tufa", "#ffb347"], ["Aima", "#ff6b5a"], ["Reku", "#6fe0d0"], ["Weki", "#b48cff"]];
function pick(a) { return a[Math.floor(rnd() * a.length)]; }
function starField(n, y1) { return Array.from({ length: n }, () => [R(0, W), Math.pow(rnd(), 1.4) * y1, R(.8, 2.6), rnd() * 9, rnd() < .06]); }
function drawStars(g, list, t) { for (const [x, y, r, ph, big] of list) { const a = .45 + .55 * Math.abs(Math.sin(t * 1.3 + ph)); g.fillStyle = `rgba(235,235,255,${a})`; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  if (big) { g.strokeStyle = `rgba(235,235,255,${a * .7})`; g.lineWidth = 1; g.beginPath(); g.moveTo(x - 7, y); g.lineTo(x + 7, y); g.moveTo(x, y - 7); g.lineTo(x, y + 7); g.stroke(); } } }
/** A tower: painted body, a window grid recorded for animation. */
function tower(g, x, top, w, bottom, col, o = {}) {
  const { cell = 16, wh = 9, ww = 7, lit = .4, list = null, b = 0, frameCol = null } = o;
  paint(g, x, top, w, bottom - top, col, { n: Math.round(w * (bottom - top) / 700), a: [.05, .14], wid: [2, 7], drips: 2 });
  g.fillStyle = hsl(col[0], col[1], col[2] + 6, .5); g.fillRect(x, top, w, 3); g.fillStyle = hsl(col[0], col[1], Math.max(3, col[2] - 5), .6); g.fillRect(x + w - 4, top, 4, bottom - top);
  for (let yy = top + cell * .8; yy < bottom - cell; yy += cell) for (let xx = x + cell * .5; xx < x + w - ww - 2; xx += cell * .78) {
    if (rnd() < lit) { if (list) list.push({ x: xx, y: yy, w: ww, h: wh, c: pick(WARM), b, gr: Math.floor(rnd() * 4), r: rnd(), ph: rnd() * 9 }); else { g.fillStyle = pick(WARM); g.globalAlpha = R(.55, 1); g.fillRect(xx, yy, ww, wh); g.globalAlpha = 1; } }
    else { g.fillStyle = hsl(col[0], col[1], Math.max(2, col[2] - 4), .55); g.fillRect(xx, yy, ww, wh); }
  }
}
function drawWins(g, list, t, { off = 0, seg = 0, groups = false, keep = null } = {}) {
  for (const w of list) { if (keep !== w && w.r < off) continue;
    let c = w.c; if (groups) c = GROUPS[(w.r < seg ? w.b % 4 : w.gr)][1];
    g.globalAlpha = .8 + .2 * Math.sin(t * 2 + w.ph); g.fillStyle = c; g.fillRect(w.x, w.y, w.w, w.h); }
  g.globalAlpha = 1;
}
function bubble(g, x, y, s, a, t) { // a chat bubble with "typing" dots
  if (a <= 0) return; g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = "rgba(245,240,228,.95)"; g.beginPath(); g.roundRect(-70, -34, 140, 68, 26); g.fill(); g.beginPath(); g.moveTo(-40, 30); g.lineTo(-58, 54); g.lineTo(-14, 32); g.fill();
  g.fillStyle = "#2b2f55"; for (let k = 0; k < 3; k++) { g.globalAlpha = a * (.35 + .65 * Math.abs(Math.sin(t * 4 - k * .7))); g.beginPath(); g.arc(-26 + k * 26, 0, 8, 0, 7); g.fill(); }
  g.restore();
}
function sitter(g, x, y, s, col) { // someone sitting on a sill, knees up, looking out (ref: window at night)
  g.save(); g.fillStyle = col; g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.arc(0, -150, 30, 0, 7); g.fill();
  g.beginPath(); g.moveTo(-40, -118); g.quadraticCurveTo(-58, -40, -46, 0); g.lineTo(150, 0); g.quadraticCurveTo(170, -20, 150, -62); g.lineTo(60, -96); g.quadraticCurveTo(30, -126, -40, -118); g.fill();
  g.beginPath(); g.moveTo(-20, -116); g.quadraticCurveTo(20, -150, 18, -170); g.lineTo(-12, -178); g.fill(); g.restore();
}
function hunched(g, x, y, s, col) { // someone at a laptop, from behind and to the side
  g.save(); g.fillStyle = col; g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.ellipse(10, -150, 34, 38, -.2, 0, 7); g.fill();
  g.beginPath(); g.ellipse(4, -168, 38, 24, -.3, Math.PI, 2 * Math.PI); g.fill(); g.beginPath(); g.moveTo(-30, -172); g.quadraticCurveTo(-44, -150, -30, -128); g.lineTo(-18, -150); g.fill();
  g.beginPath(); g.moveTo(-70, 0); g.quadraticCurveTo(-90, -80, -40, -112); g.quadraticCurveTo(10, -126, 50, -108); g.quadraticCurveTo(110, -90, 120, -40); g.lineTo(130, 0); g.closePath(); g.fill(); g.restore();
}

// ── window: a lit window on a dark wall, the city beyond (refs: sitter, laptop) ──
S.window = { build() {
  this.stars = starField(380, 1000); this.wins = [];
  this.bg = layer(W, H, (g) => {
    vgrad(g, 0, 0, W, H, [[0, "#070a22"], [.45, "#141a45"], [.62, "#222a5c"], [1, "#0a0d24"]]);
    paint(g, 0, 0, W, 1100, [232, 45, 22], { base: false, ang: 0, aj: .1, len: [120, 300], wid: [14, 40], a: [.03, .07], n: 500 });
    for (let k = 0; k < 18; k++) { const x = 480 + k * 36 + R(-10, 10), w = R(60, 120), top = R(900, 1250); tower(g, x, top, w, H, [232, 38, R(11, 16)], { cell: 13, ww: 5, wh: 7, lit: .28 }); }
    tower(g, 600, 720, 250, H, [234, 40, 13], { cell: 15, ww: 7, wh: 9, lit: .5, list: this.wins });
    tower(g, 900, 560, 200, H, [234, 40, 15], { cell: 15, ww: 6, wh: 9, lit: .32, list: this.wins });
    for (let k = 0; k < 14; k++) { const x = 440 + k * 48, top = R(1450, 1650); tower(g, x, top, R(70, 110), H, [234, 35, R(8, 12)], { cell: 18, ww: 9, wh: 9, lit: .12 }); }
    glow(g, 900, 1180, 300, "rgba(255,120,60,.10)");
  });
  this.wall = layer(W, H, (g) => {
    paint(g, -20, 0, 580, H, [232, 38, 9], { n: 4000, a: [.05, .14], drips: 20 });
    g.strokeStyle = "rgba(120,130,200,.16)"; g.lineWidth = 2;
    for (let y = 0; y < H; y += R(60, 140)) { g.beginPath(); g.moveTo(0, y); g.lineTo(560, y + R(-3, 3)); g.stroke(); for (let x = R(20, 120); x < 560; x += R(90, 220)) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + R(40, 120)); g.stroke(); } }
    g.strokeStyle = "rgba(10,10,25,.9)"; g.lineWidth = 6; g.beginPath(); g.moveTo(520, 1180); g.lineTo(520, H); g.moveTo(470, 1180); g.lineTo(470, H); g.stroke(); g.lineWidth = 3; for (let y = 1200; y < H; y += 40) { g.beginPath(); g.moveTo(470, y); g.lineTo(520, y); g.stroke(); }
    g.fillStyle = "#0a0b1d"; g.fillRect(96, 400, 440, 620); // window recess
    paint(g, 80, 1010, 476, 34, [232, 25, 22], { n: 120 });
    paint(g, 250, 1090, 230, 160, [228, 12, 30], { n: 200, dl: 6 }); g.strokeStyle = "rgba(10,10,20,.8)"; g.lineWidth = 3; for (let x = 262; x < 470; x += 16) { g.beginPath(); g.moveTo(x, 1104); g.lineTo(x, 1236); g.stroke(); }
    g.strokeStyle = "#1c1f38"; g.lineWidth = 10; g.beginPath(); g.moveTo(230, 1110); g.quadraticCurveTo(170, 1110, 170, 1300); g.lineTo(170, H); g.stroke();
  });
  this.room = layer(440, 600, (g) => {
    vgrad(g, 0, 0, 440, 600, [[0, "#ffb04a"], [.6, "#ff8a26"], [1, "#e86a14"]]);
    paint(g, 0, 0, 440, 600, [28, 100, 55], { base: false, n: 700, a: [.04, .12], wid: [6, 18] });
    g.fillStyle = "rgba(150,60,10,.38)"; g.fillRect(250, 60, 150, 180); g.fillRect(40, 70, 120, 90); g.fillRect(30, 200, 170, 12); g.fillRect(250, 300, 160, 12);
    g.strokeStyle = "rgba(120,45,5,.55)"; g.lineWidth = 6; g.beginPath(); g.arc(110, 115, 28, 0, 7); g.stroke(); g.beginPath(); g.moveTo(110, 115); g.lineTo(110, 96); g.moveTo(110, 115); g.lineTo(124, 120); g.stroke();
    g.fillStyle = "rgba(80,30,5,.5)"; g.fillRect(212, 0, 14, 600);
  });
},
draw(g, t, d, v = "laptop") {
  const s = 1.07 - .07 * ease(t / d); g.save(); g.translate(W / 2, H / 2); g.scale(s, s); g.translate(-W / 2, -H / 2);
  g.drawImage(this.bg, 0, 0); drawStars(g, this.stars, t); drawWins(g, this.wins, t);
  g.drawImage(this.wall, 0, 0); g.drawImage(this.room, 98, 410);
  glow(g, 320, 700, 380, "rgba(255,140,50,.20)");
  g.strokeStyle = "#0b0c1c"; g.lineWidth = 14; g.strokeRect(98, 410, 440, 600); g.lineWidth = 9; g.beginPath(); g.moveTo(318, 410); g.lineTo(318, 1010); g.stroke();
  if (v === "laptop") {
    hunched(g, 230, 1004, 1.25, "#160d07");
    g.fillStyle = "#0e0c14"; g.beginPath(); g.moveTo(330, 1000); g.lineTo(445, 1000); g.lineTo(470, 900); g.lineTo(355, 900); g.closePath(); g.fill();
    g.fillStyle = "#5fa6ff"; g.beginPath(); g.moveTo(364, 990); g.lineTo(440, 990); g.lineTo(460, 910); g.lineTo(383, 910); g.closePath(); g.fill(); glow(g, 420, 950, 130, "rgba(90,160,255,.45)");
    for (let k = 0; k < 5; k++) { const b = (t * .9 + k * .55) % 2.8, a = clamp(b / .3) * clamp((2.8 - b) / .8); bubble(g, 470 + b * 170 + Math.sin(b * 2 + k) * 30, 880 - b * 260 - k * 10, .8 + k * .05, a, t + k); }
  } else sitter(g, 160, 1004, 1.2, "#140b06");
  g.restore();
} };

// ── skyline: a dense starry city; windows can switch off, or sort themselves by group ──
S.skyline = { build() {
  this.stars = starField(320, 800); this.wins = [];
  this.L = layer(W, H, (g) => {
    vgrad(g, 0, 0, W, H, [[0, "#060920"], [.4, "#151b4a"], [.6, "#262c63"], [1, "#0a0c22"]]);
    paint(g, 0, 0, W, 900, [232, 45, 24], { base: false, ang: 0, aj: .1, len: [140, 320], wid: [16, 44], a: [.03, .07], n: 420 });
    for (let k = 0; k < 26; k++) tower(g, k * 44 - 30 + R(-10, 10), R(820, 1050), R(60, 110), H, [233, 35, R(14, 19)], { cell: 12, ww: 4, wh: 6, lit: .3 });
    const specs = [[40, 760, 220], [300, 600, 240], [590, 820, 200], [820, 700, 240]];
    specs.forEach(([x, top, w], b) => tower(g, x, top, w, H, [234, 40, 12 + b], { cell: 17, ww: 8, wh: 10, lit: .5, list: this.wins, b }));
    for (let k = 0; k < 12; k++) tower(g, k * 96 - 20, R(1500, 1640), R(90, 140), H, [235, 35, 8], { cell: 20, ww: 10, wh: 10, lit: .1 });
    g.fillStyle = "#ff3a28"; for (const [x, y] of [[410, 596], [920, 696], [140, 756]]) { g.beginPath(); g.arc(x, y, 4, 0, 7); g.fill(); }
  });
},
draw(g, t, d, v = "") {

const STORY = STORIES[new URLSearchParams(location.search).get("story") || "characterai"];

// ── captions ────────────────────────────────────────────────────────────────
const panel = document.getElementById("panel"); let curCap = null;
const words = (s, cls) => { let on = false; // "[key words]" turn yellow, word by word
  return `<div class="${cls}">` + s.split(" ").map((w) => { let em = on; if (w.startsWith("[")) { on = em = true; w = w.slice(1); }
    if (w.includes("]")) { w = w.replace("]", ""); on = false; } return `<span class="w">${em ? `<em>${w}</em>` : w}</span>`; }).join(" ") + "</div>"; };

};
