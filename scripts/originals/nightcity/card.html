const W = 1080, H = 780;
const YELLOW = 0xF5C400;
let seed = 20261010;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ── textures ─────────────────────────────────────────────────────────────────
// Window atlas: 8 bays x 16 floors. Wall pixels are black so roofs (uv 0,0) stay dark.
function windowTexture(litShare) {

const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { dc: { value: new THREE.Vector3(DC.x, 0, DC.z).normalize() } },
  vertexShader: `varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

}

const moon = new THREE.DirectionalLight(0x9cc7d6, 0.35); moon.position.set(-200, 300, 150); scene.add(moon);

{
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");

scene.add(new THREE.Mesh(mergeGeometries(towersGeo), wallMat(towerTex)));

// street lamps along the main street (x = 0) and cross streets: sodium sprites
const lampMat = new THREE.SpriteMaterial({ map: DOT, color: 0xffa14a, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });

  const x = (rnd() - .5) * 860, z = 60 - rnd() * 640; if (Math.abs(x) < 10) continue;

scene.add(new THREE.Mesh(mergeGeometries(poleGeos), poleMat));
// a couple of warm lights to give the near street some fill
for (const z of [38, 16, -6]) { const p = new THREE.PointLight(0xff9a45, 120, 40, 2); p.position.set(z % 2 ? -6 : 6, 6.5, z); scene.add(p); }

// ── the data center on the horizon ──────────────────────────────────────────
const dc = new THREE.Group(); dc.position.copy(DC); scene.add(dc);
{
  const shell = new THREE.MeshStandardMaterial({ color: 0x2a3338, roughness: .5, metalness: .2 });
  dc.add(new THREE.Mesh(new THREE.BoxGeometry(220, 24, 60).translate(0, 12, 0), shell));
  dc.add(new THREE.Mesh(new THREE.BoxGeometry(160, 18, 50).translate(-20, 9, -70), shell));
  const strip = new THREE.MeshBasicMaterial({ color: 0xeafcff, fog: false });
  for (const y of [5, 12, 19]) dc.add(new THREE.Mesh(new THREE.BoxGeometry(216, .9, .2).translate(0, y, 30.2), strip));
  const bay = new THREE.MeshBasicMaterial({ color: 0x8fd6e6, fog: false });

  const yard = []; for (let i = 0; i < 24; i++) yard.push(new THREE.BoxGeometry(3, 4 + rnd() * 3, 3).translate(-138 - (i % 6) * 6, 2.5, 34 - Math.floor(i / 6) * 7));

}

// ── transmission line: lattice pylons and signal-yellow conductors ─────────
const steel = new THREE.MeshStandardMaterial({ color: 0x252d31, roughness: .55, metalness: .4 });

scene.add(new THREE.Mesh(mergeGeometries(pylonGeos), steel));
const wire = new THREE.MeshBasicMaterial({ color: YELLOW });
const wires = [];
for (let i = 0; i < tips.length - 1; i++) for (let k = 0; k < 4; k++) {

{ // from the substation to the first pylon
  const s0 = V(DC.x - 138, 7, DC.z + 34);
  for (let k = 0; k < 4; k++) { const b = tips[0][k]; wires.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([s0, s0.clone().lerp(b, .5).add(V(0, -3, 0)), b]), 24, .1, 5)); }
}
// local distribution lines over the main street, to the homes
const poleTops = [];
for (let z = 50; z > -200; z -= 26) { const x = -5.8; poleTops.push(V(x, 9.2, z)); }
{
  const parts = [];
  poleTops.forEach(p => { parts.push(new THREE.CylinderGeometry(.16, .2, 9.4, 6).translate(p.x, 4.7, p.z)); parts.push(new THREE.BoxGeometry(.2, .2, .1).scale(14, 1, 1).translate(p.x, p.y - .3, p.z)); });
  scene.add(new THREE.Mesh(mergeGeometries(parts), new THREE.MeshStandardMaterial({ color: 0x2b2420, roughness: .9 })));
  for (let i = 0; i < poleTops.length - 1; i++) for (const off of [-1.2, 1.2]) {
    const a = poleTops[i].clone().add(V(off, -.4, 0)), b = poleTops[i + 1].clone().add(V(off, -.4, 0)), pts = [];
    for (let s = 0; s <= 16; s++) { const t = s / 16; const q = a.clone().lerp(b, t); q.y -= Math.sin(Math.PI * t) * 1.2; pts.push(q); }
    wires.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .045, 4));
  }
  // service drops to the first houses across the street
  for (let i = 0; i < 4; i++) { const a = poleTops[i].clone().add(V(1.2, -.4, 0)); const b = V(9.5, 5.2, poleTops[i].z - 4); wires.push(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([a, a.clone().lerp(b, .5).add(V(0, -.7, 0)), b]), 16, .035, 4)); }
}
scene.add(new THREE.Mesh(mergeGeometries(wires), wire));

// ── shots ────────────────────────────────────────────────────────────────────
const SHOTS = {
  cover:  { pos: [46, 58, 128],   look: [-6, 6, -330],  fov: 38 },
  aerial: { pos: [-150, 150, 90], look: [24, -10, -390], fov: 36 },
  street: { pos: [3.2, 2.1, 66],  look: [-1, 7.5, -200], fov: 52 },
  pylons: { pos: [-16, 3.5, 104],  look: [-26, 26, -170], fov: 50 },
};
const ANCHORS = { datacenter: V(DC.x, 30, DC.z + 30), homes: V(-60, 6, -170) };

// ── card text ───────────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const data = await (await fetch("slides.json")).json();
const i = Number(params.get("slide") ?? 0), d = data.slides[i];
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
document.getElementById("k").textContent = d.kicker.toUpperCase();
document.getElementById("date").textContent = data.date.toUpperCase();
document.getElementById("src").textContent = data.source.toUpperCase();
document.getElementById("sw").textContent = d.last ? "AIBROADSHEET.COM" : `${i + 1} / ${data.slides.length}  SWIPE →`;
document.getElementById("t").innerHTML = esc(d.headline).replace(/\[([^\]]+)\]/g, "<em>$1</em>");
await Promise.all(["700 80px Bod", "italic 800 80px Bod", "500 20px Grot", "800 20px Grot"].map(f => document.fonts.load(f)));
{ // fit the headline, then stack sides and deck under it
  const t = document.getElementById("t"), box = document.getElementById("hl");
  const maxH = d.sides ? 150 : 250; box.style.height = maxH + "px";
  let lo = 40, hi = d.sides ? 100 : 104;
  while (hi - lo > 1) { const m = (lo + hi) / 2; t.style.fontSize = m + "px"; (t.getBoundingClientRect().height <= maxH - 4 && t.scrollWidth <= box.clientWidth) ? lo = m : hi = m; }
  t.style.fontSize = lo + "px";
  let y = 846 + t.getBoundingClientRect().height + 26;
  if (d.sides) {
    const s = document.getElementById("sides"); s.style.display = "grid"; s.style.top = y + "px";
    s.innerHTML = d.sides.map(x => `<div><b>${esc(x.who).toUpperCase()}</b><p>${esc(x.says)}</p></div>`).join("");
    y += s.getBoundingClientRect().height + 22;
  }
  const deck = document.getElementById("deck"); deck.textContent = d.deck; deck.style.top = y + "px";
  if (d.sides) deck.style.fontSize = "24px";
}

// ── render ─────────────────────────────────────────────────────────────────
const shot = SHOTS[d.shot];
const cam = new THREE.PerspectiveCamera(shot.fov, W / H, 0.5, 5000);
cam.position.set(...shot.pos); cam.lookAt(V(...shot.look)); cam.updateMatrixWorld();
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.85, 0.55, 0.62));
composer.addPass(new OutputPass());
composer.render();

{ // film grain
  const g = document.getElementById("grain").getContext("2d"), im = g.createImageData(540, 390);
  for (let p = 0; p < im.data.length; p += 4) { const v = rnd() * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; }
  g.putImageData(im, 0, 0); document.getElementById("grain").style.cssText += "width:1080px;height:780px";
}
{ // pins: yellow labels with a leader line to the thing they name
  const pins = document.getElementById("pins"); let svg = "";
  (d.pins || []).forEach((p, n) => {
    const v = ANCHORS[p.at].clone().project(cam); const x = (v.x + 1) / 2 * W, y = (1 - v.y) / 2 * H;
    const below = y < H * .55, lx = Math.min(Math.max(x - 60, 56), W - 480), ly = below ? y + 80 : y - 120;
    const el = document.createElement("div"); el.className = "pin"; el.textContent = p.text; el.style.left = lx + "px"; el.style.top = ly + "px"; pins.append(el);
    const r = el.getBoundingClientRect(); const ax = Math.min(Math.max(x, r.left + 12), r.right - 12);
    svg += `<line x1="${ax}" y1="${below ? r.top : r.bottom}" x2="${x}" y2="${y}" stroke="#F5C400" stroke-width="3"/><circle cx="${x}" cy="${y}" r="7" fill="none" stroke="#F5C400" stroke-width="3"/>`;
  });
  pins.insertAdjacentHTML("beforeend", `<svg width="${W}" height="${H}">${svg}</svg>`);
}
window.__ready = true;
</script></body></html>
