<!doctype html><html><head><meta charset="utf-8">
<!--
  AI Broadsheet news card, 1080x1350 (Instagram/Facebook/LinkedIn portrait).
  House look: charcoal page, ivory Didone headline, signal-yellow key words,
  vermilion rule and kicker, the folded-page mark. render.mjs fills it.
-->
<style>
@font-face{font-family:Bod;src:url("FSRC/bodoni-moda/files/bodoni-moda-latin-700-normal.woff2");font-weight:700}
@font-face{font-family:Bod;src:url("FSRC/bodoni-moda/files/bodoni-moda-latin-800-italic.woff2");font-weight:800;font-style:italic}
@font-face{font-family:Bod;src:url("FSRC/bodoni-moda/files/bodoni-moda-latin-500-normal.woff2");font-weight:500}
@font-face{font-family:Grot;src:url("FVAR/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2");font-weight:400 900}
*{margin:0;padding:0;box-sizing:border-box}
:root{--ink:#121212;--ivory:#EFE8DA;--red:#D9412B;--y:#F5C400}
html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden;color:var(--ivory)}
#ph{position:absolute;left:0;top:0;width:1080px;height:800px;background-size:cover;background-position:center}
#ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,18,18,.55) 0%,rgba(18,18,18,0) 22%,rgba(18,18,18,0) 58%,rgba(18,18,18,.9) 90%,#121212 100%)}
#mast{position:absolute;left:56px;top:48px;display:flex;align-items:center;gap:16px}
#mast img{width:46px;height:46px}
#mast b{font-family:Bod;font-weight:700;font-size:26px;letter-spacing:5px}
#date{position:absolute;right:56px;top:60px;font-family:Grot;font-weight:600;font-size:20px;letter-spacing:3px;opacity:.85}
#kick{position:absolute;left:72px;top:800px;display:flex;align-items:center;gap:18px;font-family:Grot;font-weight:800;font-size:22px;letter-spacing:4px;color:var(--red)}
#kick i{display:block;width:56px;height:5px;background:var(--red)}
#hl{position:absolute;left:72px;right:72px;top:846px;height:318px;overflow:hidden;display:flex;align-items:flex-start}
#hl div{font-family:Bod;font-weight:700;line-height:1.02;letter-spacing:-.5px}
#hl em{font-style:italic;font-weight:800;color:var(--y)}
#deck{position:absolute;left:72px;right:72px;top:1190px;font-family:Grot;font-weight:500;font-size:28px;line-height:1.3;opacity:.9}
#foot{position:absolute;left:72px;right:72px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-family:Grot;font-weight:600;font-size:19px;letter-spacing:2px;opacity:.75;border-top:1.5px solid rgba(239,232,218,.35);padding-top:16px}
#foot .sw{color:var(--y);opacity:1}
</style></head><body>
<div id="ph"></div>
<div id="mast"><img src="MARK" alt=""><b>AI BROADSHEET</b></div>
<div id="date"></div>
<div id="kick"><i></i><span id="k"></span></div>
<div id="hl"><div id="t"></div></div>
<div id="deck"></div>
<div id="foot"><span id="src"></span><span class="sw">SWIPE →</span></div>
<script>
window.build = (d) => {
  const ph = document.getElementById('ph');
  ph.style.backgroundImage = `url("${d.photo}")`;
  if (d.pos) ph.style.backgroundPosition = d.pos;
  if (d.filter) ph.style.filter = d.filter;
  document.getElementById('k').textContent = (d.kicker || '').toUpperCase();
  document.getElementById('date').textContent = (d.date || '').toUpperCase();
  document.getElementById('deck').textContent = d.deck || '';
  document.getElementById('src').textContent = (d.source || '').toUpperCase();
  if (d.swipe === false) document.querySelector('#foot .sw').textContent = 'AIBROADSHEET.COM';
  const t = document.getElementById('t');
  t.innerHTML = d.headline.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\[([^\]]+)\]/g,'<em>$1</em>');
  let lo = 40, hi = 120; const box = document.getElementById('hl');
  while (hi - lo > 1) { const m = (lo + hi) / 2; t.style.fontSize = m + 'px'; (t.getBoundingClientRect().height <= box.clientHeight - 6 && t.scrollWidth <= box.clientWidth) ? lo = m : hi = m; }
  t.style.fontSize = lo + 'px';
};
</script></body></html>
