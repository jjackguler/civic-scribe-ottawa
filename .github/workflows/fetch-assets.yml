# Fetches public-domain photos and CC0 sounds/music for the collage explainers
# into the `assets` branch (see scripts/assets/fetch_assets.py for sources and
# license checks). Runs when the `assets-fetch` branch is pushed, or by hand.
name: Fetch collage assets

on:
  push:
    branches: [assets-fetch, assets-fetch-reels]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-assets
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        timeout-minutes: 30
        continue-on-error: true
        run: |
          mkdir -p ../assets-out
          ONLY=people FOLDER=reels PER=4 BUDGET_SEC=1500 PEOPLE="lineman climbing utility pole 1940s;Rural Electrification Administration farm electricity;electric meter reader;family living room radio lamp 1940s;children talking on telephone 1950s;girl talking on telephone 1940s;teenagers 1950s soda fountain;boy listening to radio 1940s;children classroom 1940s Office of War Information;mother reading to child 1940s;Elektro robot Westinghouse 1939;Unimate robot;industrial robot arm;packing department workers 1940s;welder 1940s Office of War Information;taxi driver 1940s;dishwasher restaurant kitchen 1940s;nurse 1940s Office of War Information" python3 scripts/assets/fetch_assets.py ../assets-out > ../assets-out/run-reels.txt 2>&1 || true
          mv ../assets-out/credits-people.json ../assets-out/credits-reels.json || true
          mv ../assets-out/log-people.txt ../assets-out/log-reels.txt || true
          du -sh ../assets-out/* || true
      - name: Commit to the assets branch
        if: always()
        run: |
          B="$RUNNER_TEMP/assets-branch"
          git fetch origin assets || true
          if git rev-parse --verify origin/assets >/dev/null 2>&1; then
            git worktree add -B assets "$B" origin/assets
          else
            git worktree add --orphan -b assets "$B"
          fi
          mkdir -p "$B/collage"
          cp -r ../assets-out/* "$B/collage/"
          cd "$B"
          git config user.name "AI Broadsheet Assets"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Collage assets $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
          git push origin assets
