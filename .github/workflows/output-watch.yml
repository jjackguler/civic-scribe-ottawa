# Output watch: once a day, checks what was actually published (newsroom
# articles, Original videos), not whether the workflows went green. Fails,
# and so emails once a day, only when nothing new was published for too long.
# No credentials, no paid calls. Limits: vars OUTPUT_WATCH_STALE_HOURS (24),
# OUTPUT_WATCH_ORIGINALS_STALE_HOURS (72); the daily minimum comes from
# newsroom/DIRECTIVES.md (fewer is a warning). A failure also opens (or adds to)
# one GitHub issue, "Output watch: nothing published", which closes itself when
# output is back, so a red day can't go unnoticed in the inbox.
name: Output watch

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the store branches
        run: git fetch --depth=1 origin +refs/heads/newsroom:refs/remotes/origin/newsroom +refs/heads/media:refs/remotes/origin/media
      - name: Check published output
        env:
          OUTPUT_WATCH_STALE_HOURS: ${{ vars.OUTPUT_WATCH_STALE_HOURS }}
          OUTPUT_WATCH_ORIGINALS_STALE_HOURS: ${{ vars.OUTPUT_WATCH_ORIGINALS_STALE_HOURS }}
          OUTPUT_WATCH_REPORT: ${{ runner.temp }}/output-watch.md
        run: npx --yes tsx@4 scripts/output-watch.ts
      - name: Raise the alert issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/output-watch.md
        run: |
          title="Output watch: nothing published"
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(cat "$REPORT" 2>/dev/null || echo '- The check itself failed; see the run log.')

          Run: $run. First job of the day: read the latest Newsroom run summary. This issue closes itself when output is back."
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
      - name: Close the alert issue when output is back
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --state open --search "\"Output watch: nothing published\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue close "$n" --comment "Output is back: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
