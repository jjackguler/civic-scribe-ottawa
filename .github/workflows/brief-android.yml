name: Build Brief Android test artifacts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/android/**"
      - "android/**"
      - ".github/workflows/brief-android.yml"
      - "public/manifest.webmanifest"
      - "public/brief/*512.png"
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android project from repository manifest and icons
        run: |
          npm ci --prefix tools/android --no-audit --no-fund
          node tools/android/generate.mjs
      - name: Verify runner SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Build debug APK and unsigned app bundle
        working-directory: android/generated
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: brief-android-test-only
          path: |
            android/generated/app/build/outputs/apk/debug/*.apk
            android/generated/app/build/outputs/bundle/release/*.aab
            android/twa-manifest.json
          if-no-files-found: error
          retention-days: 14
