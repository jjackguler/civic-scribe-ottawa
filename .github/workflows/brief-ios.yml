name: Build and test Brief iOS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/brief-ios.yml"
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          mkdir -p ios/TheBrief/Assets.xcassets/AppIcon.appiconset
          sips -z 1024 1024 public/brief/icon-512.png --out ios/TheBrief/Assets.xcassets/AppIcon.appiconset/icon.png
          cd ios
          xcodegen generate
      - name: Build and test simulator app
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/TheBrief.xcodeproj -scheme TheBrief -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/build -resultBundlePath ios/TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Export native screen evidence
        if: always()
        run: |
          if [ -d ios/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/TestResults.xcresult --output-path ios/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brief-ios-simulator-not-app-store
          path: |
            ios/build/Build/Products/Debug-iphonesimulator/TheBrief.app
            ios/TestResults.xcresult
            ios/screenshots
          retention-days: 14
