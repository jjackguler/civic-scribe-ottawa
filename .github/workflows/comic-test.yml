# One-off: a few Gemini test panels for the motion-comic art direction. Nothing is published.
name: Comic still test
on:
  push:
    branches: [comic-run]
    paths: [".github/workflows/comic-test.yml", "scripts/originals/comic/still-test.mjs"]
permissions:
  contents: read
jobs:
  stills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: scripts/originals/comic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node still-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: comic-stills
          path: scripts/originals/comic/out/*.png
