# Puts published Sir Jack Files reels on YouTube Shorts, using the copies the site
# already serves from the media branch and the existing YOUTUBE_* secrets. The reels
# and their titles are listed in scripts/originals/noir-publish/youtube.json.
name: Noir YouTube

on:
  push:
    branches: [claude/noir-publish]
    paths: [".github/workflows/noir-youtube.yml", "scripts/originals/noir-youtube.ts", "scripts/originals/noir-publish/youtube.json"]

permissions:
  contents: read

concurrency:
  group: noir-youtube
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch the published reels
        run: |
          mkdir -p "$RUNNER_TEMP/reels"
          for id in $(jq -r '.[].id' scripts/originals/noir-publish/youtube.json); do
            curl -fsSL -o "$RUNNER_TEMP/reels/$id.mp4" "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/media/originals/files/$id.mp4"
          done
          ls -la "$RUNNER_TEMP/reels"
      - name: Upload to YouTube
        working-directory: scripts/originals
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npx tsx noir-youtube.ts "$RUNNER_TEMP/reels"
