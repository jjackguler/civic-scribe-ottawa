# After the Headline (scripts/originals/comic/podcast.mjs): two-host episodes voiced with
# ElevenLabs stock voices. Runs when a script under podcasts/ is pushed to `comic-run`, or by
# hand. The MP3s are uploaded as the run's artifact; nothing is published from here.
name: Podcast

on:
  push:
    branches: [comic-run]
    paths: ["scripts/originals/comic/podcasts/**", "scripts/originals/comic/podcast.mjs", ".github/workflows/podcast.yml"]
  workflow_dispatch:
    inputs:
      slugs:
        description: Episode slugs, space-separated
        default: "agents-week the-good-room"

permissions:
  contents: read

jobs:
  podcast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scripts/originals/comic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - uses: actions/cache/restore@v4
        with:
          path: scripts/originals/comic/build
          key: podcast-${{ github.run_id }}
          restore-keys: podcast-
      - name: Voice and mix
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: for s in ${{ inputs.slugs || 'agents-week the-good-room' }}; do node podcast.mjs "$s"; done
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/originals/comic/build
          key: podcast-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: podcast
          path: |
            scripts/originals/comic/out/*.mp3
            scripts/originals/comic/out/*.json
